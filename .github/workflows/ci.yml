name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # GitHub runners have no GPU: PoCL runs the same OpenCL kernels on the CPU, so correctness is still checked.
    # Ubuntu's PoCL package is used rather than the pip wheel, which does not know every runner CPU model.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y pocl-opencl-icd ocl-icd-libopencl1
      - run: pip install -e ".[dev]"
      - run: python -m gkp info
      - name: Correctness of every kernel variant against NumPy
        run: pytest -q
